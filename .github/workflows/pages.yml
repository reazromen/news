name: Build and deploy Git-canonical news

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: news-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build static news site
        run: python scripts/build.py --output dist
      - name: Verify artifact
        run: |
          test -s dist/index.html
          test -s dist/sitemap.xml
          test -s dist/feed.xml
          test -s dist/CNAME
          test ! -d dist/content
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
